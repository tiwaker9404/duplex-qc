[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-qc"
version = "0.1.0"
description = "QA gate for two-channel conversational speech datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
duplex-qc = "duplexqc.cli:main"

[tool.setuptools]
packages = ["duplexqc"]
